services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      # Hot reload confiable en WSL2 / Docker Desktop
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp:8787/mcp}
    volumes:
      - ./apps/web:/app/apps/web
      # Solo las fuentes de los packages, no la carpeta completa: montar
      # ./packages taparia packages/a2ui/node_modules (los symlinks que crea
      # pnpm) y `zod` dejaria de resolverse en un clon limpio.
      - ./packages/a2ui/src:/app/packages/a2ui/src
      - ./packages/catalog/banorte-catalog.json:/app/packages/catalog/banorte-catalog.json
      # volumenes anonimos: node_modules y .next viven en el contenedor
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      - mcp
    command: pnpm --filter web dev

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile.dev
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: development
      PORT: "8787"
    volumes:
      - ./apps/mcp:/app/apps/mcp
      - ./packages/a2ui/src:/app/packages/a2ui/src
      - ./packages/catalog/banorte-catalog.json:/app/packages/catalog/banorte-catalog.json
      - /app/node_modules
      - /app/apps/mcp/node_modules
    command: pnpm --filter mcp dev
